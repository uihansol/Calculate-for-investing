name: Update FRED credit-cycle data
on:
  push:
    paths:
      - "credit-cycle/**"
  schedule:
    - cron: "15 2 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download FRED data
        run: |
          mkdir -p credit-cycle/data
          for s in BAA AAA GS10 GS2 DBAA DAAA DGS10 DGS2; do
            curl -L --fail --retry 3 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=$s&cosd=1976-06-01&coed=$(date -u +%Y-%m-%d)" -o "credit-cycle/data/$s.csv"
          done
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add credit-cycle/data
          git diff --cached --quiet || (git commit -m "Update FRED credit-cycle data" && git push)
